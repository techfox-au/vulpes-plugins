    <h1 id="title">Set up your sign-in</h1>
    <div id="error" class="alert danger hidden" role="alert"></div>
    <div id="loading" class="muted">Checking your link…</div>

    <div id="content" class="col hidden">
      <p>Hello <strong id="who"></strong>.</p>
      <div class="tabs" role="tablist">
        <button class="tab active" type="button" id="tab-passkey" role="tab">Passkey</button>
        <button class="tab" type="button" id="tab-password" role="tab">Password</button>
      </div>
      <div id="panel-passkey" class="col">
        <div class="field">
          <label for="passkeyName">Name for this key</label>
          <input class="input" id="passkeyName" value="Passkey" maxlength="60">
        </div>
        <button class="btn primary lg block" id="submit-passkey" type="button">Register passkey and sign in</button>
      </div>
      <form id="panel-password" class="col hidden" novalidate>
        <div class="field">
          <label for="password">New password</label>
          <input class="input" id="password" type="password" autocomplete="new-password">
        </div>
        <div class="field">
          <label for="password2">Repeat password</label>
          <input class="input" id="password2" type="password" autocomplete="new-password">
        </div>
        <button class="btn primary lg block" id="submit-password" type="submit">Set password and sign in</button>
      </form>
    </div>
  </main>
</body>
</html>
